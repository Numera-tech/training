<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Trainingsplan</title>
<style>
:root{
  --bg:#0f1113; --surface:#181b1f; --surface-2:#22262c; --line:#2e333a;
  --text:#eceff2; --muted:#a1a9b3; --faint:#6f7781;
  --accent:#7fd4a6; --accent-ink:#0c2618; --warn:#f2bb5a; --warn-ink:#2b1d05;
  --danger:#f08a8a; --focus:#9cc7ff;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(160px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.top h1{font-size:20px;margin:0;font-weight:650}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn:active{background:var(--surface-2)}
.back{display:flex;align-items:center;gap:4px;color:var(--muted);height:44px;padding-right:8px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);padding:4px;border-radius:var(--r);margin:8px 0 14px}
.tab{padding:10px 6px;border-radius:10px;text-align:center;color:var(--muted)}
.tab b{display:block;font-size:15px;color:inherit}
.tab small{font-size:12px}
.tab[aria-selected=true]{background:var(--surface-2);color:var(--text)}
.tab[aria-selected=true] small{color:var(--muted)}

.meta{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;color:var(--muted);font-size:14px}
.meta strong{color:var(--text);font-weight:600}
.rules{font-size:13px;color:var(--muted);margin:0 2px 14px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;background:var(--surface);border-radius:var(--r);border:1px solid transparent}
.row.active{border-color:var(--accent)}
.row .open{flex:1;display:flex;align-items:center;gap:12px;padding:12px 4px 12px 12px;text-align:left;min-width:0}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;
  border:2px solid var(--line);color:var(--muted)}
.row.part .num{border-color:var(--warn);color:var(--warn)}
.row.done .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.done .num svg{width:16px;height:16px;stroke-width:3}
.row.skip .num{border-style:dashed}
.row .txt{min-width:0;flex:1}
.row .name{font-weight:560;line-height:1.25}
.row.skip .name{color:var(--muted)}
.row .sub{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.pill{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.up{background:var(--warn);color:var(--warn-ink);font-weight:600}
.pill.ok{background:rgba(127,212,166,.15);color:var(--accent)}
.check{flex:none;width:52px;height:56px;display:grid;place-items:center;color:var(--faint)}
.check span{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.row.done .check span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:16px;height:16px;stroke-width:3}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:12px;
  background:var(--surface-2);font-weight:600;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--muted);font-weight:500}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.btn:active:not(:disabled){filter:brightness(1.1)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:18px}

/* Übungsansicht */
.exhead h1{font-size:24px;line-height:1.2;margin:4px 0 2px}
.exhead p{margin:0;color:var(--muted)}
.hint{margin-top:10px;font-size:14px;background:var(--surface);border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 10px 10px 0}
.card{background:var(--surface);border-radius:var(--r);padding:14px;margin-top:12px}
.card h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.banner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn);color:var(--warn-ink);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.banner svg{flex:none;width:18px;height:18px}
.last{font-size:14px;color:var(--muted);margin-top:10px}
.last strong{color:var(--text);font-weight:600}

.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;background:var(--surface-2);font-size:22px;flex:none}
.stepper input{flex:1;min-width:0;height:48px;text-align:center;font-size:22px;font-weight:650;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.unit{color:var(--muted);width:28px}

.set{display:grid;grid-template-columns:64px 1fr 52px;align-items:center;gap:10px;padding:6px 0}
.set + .set{border-top:1px solid var(--line)}
.set label{color:var(--muted);font-size:14px}
.set input{height:46px;width:100%;text-align:center;font-size:18px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.set.done label{color:var(--accent)}
.tick{width:48px;height:46px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.set.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{stroke-width:3}
.target{font-size:13px;color:var(--muted);margin:8px 0 0}

.rests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rest label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.rest .stepper button{width:40px;height:40px;font-size:18px}
.rest output{flex:1;text-align:center;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}

textarea{width:100%;min-height:72px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.field + .field{margin-top:12px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist li:first-child{border-top:0}
.hist span:first-child{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}

.actionbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.actionbar .in{max-width:560px;margin:0 auto}
.actionbar .btn.primary{min-height:58px;flex-direction:column;gap:0;font-size:17px}
.actionbar .btn small{font-weight:500;font-size:13px;opacity:.8}

/* Timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.timer .in{max-width:560px;margin:0 auto}
.t-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.t-top b{color:var(--text);font-weight:600}
.t-time{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 8px;letter-spacing:-.02em}
.t-bar{height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.t-bar i{display:block;height:100%;width:100%;background:var(--warn);transform-origin:left;transition:transform .25s linear}
.t-btns{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-top:12px}
.timer.fin{border-top-color:var(--accent)}
.timer.fin .t-time{color:var(--accent)}
.timer.fin .t-bar i{background:var(--accent)}

.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px}
.switch + .switch{border-top:1px solid var(--line)}
.switch small{display:block;color:var(--muted);font-size:13px}
.switch input{appearance:none;flex:none;width:50px;height:30px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(20px);background:var(--accent-ink)}
.p{font-size:14px;color:var(--muted);margin:0 0 10px}

.todaycard{background:var(--surface);border-radius:var(--r);padding:14px;margin:6px 0 10px}
.k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.todaycard .t{font-size:24px;font-weight:650;margin:2px 0 0}
.todaycard .s{color:var(--muted);font-size:14px;margin-top:2px}
.todaycard .s strong{color:var(--text);font-weight:600}
.todaycard .btn{margin-top:12px}
.ev{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:6px}
.ev svg{width:16px;height:16px;flex:none;color:var(--muted)}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--warn);margin-top:6px}
.warn svg{flex:none;width:18px;height:18px;margin-top:1px}
.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-left:3px solid var(--danger);
  border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:8px;font-size:14px}
.sbtn{flex:none;min-height:40px;padding:6px 14px;border-radius:10px;background:var(--surface-2);font-size:14px;font-weight:600}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.wknav h1{font-size:22px;margin:0}
.wknav .k{margin-top:2px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:400}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);padding:4px;border-radius:12px}
.seg button{min-height:40px;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--text);font-weight:600}
.seglbl{font-size:14px;color:var(--muted);margin:0 2px 6px}
.days{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.wday{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:44px 1fr;gap:10px;border:1px solid transparent}
.wday.is-today{border-color:var(--accent)}
.wday.past{opacity:.7}
.wday .dl b{display:block;font-size:17px}
.wday .dl small{color:var(--muted);font-size:12px}
.wday .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wday .gym{font-weight:600}
.wday .rest{color:var(--muted)}
.wday .sub{font-size:13px;color:var(--muted)}
.wday .sbtn{margin-top:8px}
.pill.miss{background:rgba(240,138,138,.16);color:var(--danger)}
.pill.now{background:rgba(127,212,166,.15);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:12px 14px;border:1px solid transparent}
.opt b{font-weight:600}
.opt .why{color:var(--muted);font-size:14px}
.opt:disabled{opacity:.5}
.opt.cur{border-color:var(--accent);opacity:1}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9;background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<div class="actionbar" id="bar" hidden><div class="in" id="barIn"></div></div>

<section class="timer" id="timer" hidden aria-label="Pausen-Timer">
  <div class="in">
    <div class="t-top"><b id="tLabel">Satzpause</b><span id="tNext"></span></div>
    <div class="t-time" id="tTime" role="timer">0:00</div>
    <div class="t-bar"><i id="tBar"></i></div>
    <div class="t-btns">
      <button class="btn" data-action="tAdd" data-v="-15">−15 s</button>
      <button class="btn" data-action="tAdd" data-v="15">+15 s</button>
      <button class="btn primary" data-action="tEnd" id="tEnd">Pause beenden</button>
    </div>
  </div>
</section>
<div class="sr" aria-live="assertive" id="live"></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ---------- Plan ---------- */
const RAW = [
  {id:"push", name:"Push", sub:"Brust · Schulter · Trizeps", ex:[
    ["Bankdrücken an der Multipresse","Brust"],
    ["Schrägbankdrücken mit Kurzhanteln","obere Brust"],
    ["Butterfly (Maschine oder Kabel)","Brust"],
    ["Dips","Brust / Trizeps","Nur bis die Oberarme ca. parallel zum Boden sind. Unter 8 Wdh.: Dip-Maschine mit Gegengewicht. Über 12 Wdh.: Zusatzgewicht."],
    ["Schulterdrücken mit Kurzhanteln","vordere / seitliche Schulter"],
    ["Seitheben","seitliche Schulter"],
    ["Trizepsdrücken am Kabel (Seil)","Trizeps"],
    ["Überkopf-Trizepsstrecken am Kabel","Trizeps (langer Kopf)"]
  ]},
  {id:"pull", name:"Pull", sub:"Rücken · Bizeps", ex:[
    ["Klimmzüge","Latissimus / oberer Rücken","Unter 8 Wdh.: Klimmzugmaschine mit Gegengewicht oder Widerstandsband. Über 12 Wdh.: Zusatzgewicht."],
    ["Latzug (breiter Griff)","Latissimus"],
    ["Kabelrudern sitzend","mittlerer Rücken"],
    ["Reverse Butterfly (Maschine)","hintere Schulter / oberer Rücken","Alternative: vorgebeugtes Seitheben mit Kurzhanteln."],
    ["Langhantel-Curls","Bizeps"],
    ["Schrägbank-Curls mit Kurzhanteln","Bizeps (langer Kopf)"],
    ["Hammer-Curls","Bizeps / Unterarm"]
  ]},
  {id:"legs", name:"Beine", sub:"Beine · Bauch", ex:[
    ["Kniebeugen","Oberschenkel / Gesäß","Alternative: Beinpresse."],
    ["Rumänisches Kreuzheben","Beinbeuger / Gesäß"],
    ["Beinstrecker","Quadrizeps"],
    ["Beinbeuger (Maschine)","hintere Oberschenkel"],
    ["Wadenheben","Waden"],
    ["Kabel-Crunches","Bauch"],
    ["Beinheben im Hang","unterer Bauch"],
    ["Plank","Rumpf","2 Sätze à 30–60 Sekunden halten statt Wiederholungen.","sec"]
  ]}
];
const DAYS = RAW.map(d => ({...d, ex: d.ex.map((e,i) => {
  const sec = e[3] === "sec";
  return {id:`${d.id}-${i+1}`, day:d.id, idx:i, name:e[0], target:e[1], hint:e[2]||"",
    unit: sec ? "sec" : "reps", min: sec?30:8, max: sec?60:12, sets:2};
})}));
const EX = Object.fromEntries(DAYS.flatMap(d => d.ex.map(e => [e.id, e])));
const dayOf = id => DAYS.find(d => d.id === id);

/* ---------- Wochenplan ---------- */
// Wochentags-Index: 0 = Montag … 6 = Sonntag
const WD  = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const WDS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DEFAULT_PLAN = {push:1, legs:2, pull:4};   // Di Push · Mi Beine · Fr Pull
const FB_TRAIN = [1, 3];                         // Fußballtraining Di + Do, 19–22 Uhr
const BLOCKED = {0:"Schule & Uni"};              // Montag kein Training möglich
const MATCH_DAYS = [5, 6];                       // Spiel Sa oder So
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const wdIdx = d => (d.getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const m = new Date(d); m.setHours(0,0,0,0); return addDays(m, -wdIdx(m)); };
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const dm = d => d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"});
function week(d){ const k = keyOf(monday(d)); return (S.weeks[k] ||= {plan:{...DEFAULT_PLAN}, match:null}); }
const dayAt = (w, i) => Object.keys(w.plan).find(id => w.plan[id] === i) || null;
function doneInWeek(id, mon){
  const a = +mon, b = +addDays(mon, 7);
  return S.history.some(h => h.day === id && +new Date(h.date) >= a && +new Date(h.date) < b);
}
function fbEvents(w, i){
  const ev = [];
  if (FB_TRAIN.includes(i)) ev.push("Fußballtraining 19–22 Uhr");
  if (w.match === i) ev.push("Fußballspiel");
  else if (w.match == null && MATCH_DAYS.includes(i)) ev.push("Spiel Sa oder So, noch offen");
  return ev;
}
// Warnungen, wenn der Beintag vom Mittwoch wegrutscht
function legsWarnings(i, w){
  if (i === DEFAULT_PLAN.legs) return [];
  const out = [], n = (i + 1) % 7, matches = w.match == null ? MATCH_DAYS : [w.match];
  const mOpen = w.match == null;
  if (FB_TRAIN.includes(i)) out.push(`Am ${WD[i]} ist abends Fußballtraining.`);
  if (matches.includes(i)) out.push(mOpen ? `${WD[i]} ist ein möglicher Spieltag.` : `${WD[i]} ist Spieltag.`);
  if (i < 6 && FB_TRAIN.includes(n)) out.push(`Direkt vor dem Fußballtraining am ${WD[n]}.`);
  if (i < 6 && matches.includes(n)) out.push(mOpen ? `Direkt vor einem möglichen Spiel am ${WD[n]}.` : `Direkt vor dem Spiel am ${WD[n]}.`);
  return out;
}
function nextTraining(fromToday){
  const t = today0();
  for (let n = fromToday ? 0 : 1; n <= 14; n++){
    const d = addDays(t, n), id = dayAt(week(d), wdIdx(d));
    if (id && !doneInWeek(id, monday(d))) return {d, id, n};
  }
  return null;
}
const whenTxt = x => x.n === 0 ? "heute" : x.n === 1 ? `morgen (${WD[wdIdx(x.d)]})` : x.n < 7 ? WD[wdIdx(x.d)] : `${WD[wdIdx(x.d)]}, ${dm(x.d)}`;

/* ---------- Speicher (nur lokal im Browser) ---------- */
const KEY = "trainingsplan.v1";
const DEFAULTS = {restSet:90, restEx:120, sound:true, vibrate:true, wake:true, step:2.5};
function fresh(){ return {v:1, settings:{...DEFAULTS}, ex:{}, sessions:{}, history:[], weeks:{}, day:"push", active:null, timer:null}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1) { s.settings = {...DEFAULTS, ...s.settings}; s.ex ||= {}; s.sessions ||= {}; s.history ||= []; s.weeks ||= {}; return s; }
  }catch(e){}
  return fresh();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Speichern fehlgeschlagen"); } }

const exData = id => (S.ex[id] ||= {weight:"", setup:"", note:""});
const session = day => (S.sessions[day] ||= {started:null, items:{}});
function item(id){
  const its = session(EX[id].day).items;
  return (its[id] ||= {skipped:false, sets:Array.from({length:EX[id].sets}, () => ({done:false, val:""}))});
}
const isDone = it => it.sets.every(s => s.done);
const doneCount = it => it.sets.filter(s => s.done).length;
const reached = (ex, vals) => vals.length >= ex.sets && vals.every(v => v !== "" && Number(v) >= ex.max);
function lastEntry(id){
  for (let i = S.history.length - 1; i >= 0; i--){
    const h = S.history[i].items[id];
    if (h && h.vals.some(v => v !== "")) return {...h, date:S.history[i].date};
  }
  return null;
}
function progressDue(id){
  const ex = EX[id], it = item(id);
  if (it.sets.some(s => s.val !== "")) return reached(ex, it.sets.map(s => s.val));
  const l = lastEntry(id); return !!(l && reached(ex, l.vals));
}
function nextOpen(id){
  const d = dayOf(EX[id].day), n = d.ex.length;
  for (let k = 1; k < n; k++){
    const e = d.ex[(EX[id].idx + k) % n], it = item(e.id);
    if (!isDone(it) && !it.skipped) return e;
  }
  return null;
}

const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const fmtNum = n => String(Math.round(n*100)/100).replace(".", ",");
const unitWord = ex => ex.unit === "sec" ? "Sek." : "Wdh.";

let toastT;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- Routing ---------- */
const go = h => { location.hash = h; };
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith("/ex/") && EX[h.slice(4)]) return renderEx(h.slice(4));
  if (h === "/settings") return renderSettings();
  let m = h.match(/^\/week(?:\/(-?\d+))?$/);
  if (m) return renderWeek(Number(m[1] || 0));
  m = h.match(/^\/move\/(\d{4}-\d{2}-\d{2})\/(push|pull|legs)$/);
  if (m) return renderMove(m[1], m[2]);
  renderHome();
}

function syncBars(){ bar.hidden = !barIn.innerHTML || !!S.timer; }

function renderHome(){
  const d = dayOf(S.day) || DAYS[0];
  const done = d.ex.filter(e => isDone(item(e.id))).length;
  const touched = d.ex.some(e => { const it = item(e.id); return doneCount(it) || it.skipped || it.sets.some(s => s.val !== ""); });

    <div class="top"><h1>Trainingsplan</h1>
      <span style="display:flex;gap:4px"><button class="iconbtn" data-action="week" aria-label="Wochenübersicht">${I.cal}</button><button class="iconbtn" data-action="settings" aria-label="Einstellungen">${I.gear}</button></span></div>
    ${todayHTML()}
    <div class="tabs" role="tablist">${DAYS.map((x,i) => [x,i]).sort((a,b) => week(today0()).plan[a[0].id] - week(today0()).plan[b[0].id]).map(([x,i]) => `
      <button class="tab" role="tab" aria-selected="${x.id===d.id}" data-action="day" data-day="${x.id}">
        <small>Tag ${i+1} · ${WDS[week(today0()).plan[x.id]]}</small><b>${esc(x.name)}</b></button>`).join("")}</div>
    <div class="meta"><span><strong>${done} von ${d.ex.length}</strong> Übungen erledigt</span>

}
function todayHTML(){
  const t = today0(), i = wdIdx(t), mon = monday(t), w = week(t), id = dayAt(w, i);
  const ev = fbEvents(w, i).map(e => `<div class="ev">${I.ball}<span>${esc(e)}</span></div>`).join("");
  const nx = nextTraining(false);
  const nxTxt = nx ? `<div class="s">Nächstes Training: <strong>${esc(whenTxt(nx))} · ${esc(dayOf(nx.id).name)}</strong></div>` : "";
  const missed = Object.keys(w.plan).filter(x => w.plan[x] < i && !doneInWeek(x, mon)).sort((a,b) => w.plan[a] - w.plan[b]);
  const alerts = missed.map(x => `<div class="alert"><span><strong>${esc(dayOf(x).name)}</strong> am ${WD[w.plan[x]]} verpasst</span>
      <button class="sbtn" data-action="move" data-key="${keyOf(mon)}" data-id="${x}">Verschieben</button></div>`).join("");
  const warn = id === "legs" ? legsWarnings(i, w).map(x => `<div class="warn">${I.alert}<span>${esc(x)}</span></div>`).join("") : "";
  let body;
  if (id && !doneInWeek(id, mon)){
    body = `<div class="k">Heute · ${WD[i]}</div><div class="t">${esc(dayOf(id).name)}</div>
      <div class="s">${esc(dayOf(id).sub)}</div>${ev}${warn}

  } else if (id){
    body = `<div class="k">Heute · ${WD[i]}</div><div class="t">${esc(dayOf(id).name)} erledigt</div>${nxTxt}${ev}`;
  } else {
    body = `<div class="k">Heute · ${WD[i]}</div><div class="t">Ruhetag</div>

  }
  return `<section class="todaycard" aria-label="Heute">${body}</section>${alerts}`;
}
function rowHTML(e){
  const it = item(e.id), dc = doneCount(it), all = isDone(it);
  const cls = all ? "done" : it.skipped ? "skip" : dc ? "part" : "";
  const w = exData(e.id).weight;
  const bits = [];
  if (it.skipped) bits.push(`<span>übersprungen</span>`);
  else if (dc && !all) bits.push(`<span>Satz ${dc}/${it.sets.length}</span>`);
  else bits.push(`<span>${esc(e.target)}</span>`);
  if (w !== "") bits.push(`<span class="pill">${esc(w)} kg</span>`);
  if (progressDue(e.id)) bits.push(`<span class="pill up">${e.unit==="sec" ? "steigern" : "Gewicht +"}</span>`);
  return `<li class="row ${cls} ${S.active===e.id ? "active":""}">
    <button class="open" data-action="open" data-id="${e.id}">
      <span class="num">${all ? I.check : e.idx+1}</span>
      <span class="txt"><div class="name">${esc(e.name)}</div><div class="sub">${bits.join("")}</div></span>
    </button>
    <button class="check" data-action="quick" data-id="${e.id}" aria-pressed="${all}" aria-label="${esc(e.name)} als ${all?"nicht ":""}erledigt markieren"><span>${all ? I.check : ""}</span></button>
  </li>`;
}

function dueHTML(ex, it, lastDue){
  const cur = reached(ex, it.sets.map(s => s.val));
  if (cur) return `<div class="banner">${I.up}<span>${ex.unit==="sec" ? "Beide Sätze ≥ 60 s – nächstes Mal steigern." : "Beide Sätze ≥ 12 Wdh. – nächstes Mal Gewicht erhöhen."}</span></div>`;
  if (lastDue && !it.sets.some(s => s.val!=="")) return `<div class="banner">${I.up}<span>${ex.unit==="sec" ? "Letztes Mal Ziel geschafft – heute steigern." : "Letztes Mal 2× 12 geschafft – heute Gewicht erhöhen."}</span></div>`;
  return "";
}
function restHTML(key, label){
  return `<div class="rest"><label>${label}</label>
    <div class="stepper">
      <button data-action="rest" data-k="${key}" data-v="-15" aria-label="${label}: 15 Sekunden weniger">−</button>
      <output id="o-${key}" aria-live="polite">${fmt(S.settings[key])}</output>
      <button data-action="rest" data-k="${key}" data-v="15" aria-label="${label}: 15 Sekunden mehr">+</button>
    </div></div>`;
}
function primaryHTML(ex, it){
  const n = it.sets.findIndex(s => !s.done);
  const nx = nextOpen(ex.id);
  if (it.skipped || n === -1){
    return nx ? `<button class="btn primary" data-action="open" data-id="${nx.id}">Nächste Übung<small>${esc(nx.name)}</small></button>`
              : `<button class="btn primary" data-action="home">Zur Übersicht<small>Alle Übungen erledigt</small></button>`;
  }
  const lastSet = n === it.sets.length - 1;
  if (!lastSet) return `<button class="btn primary" data-action="setDone">Satz ${n+1} fertig<small>dann ${fmt(S.settings.restSet)} Pause</small></button>`;
  return `<button class="btn primary" data-action="setDone">Satz ${n+1} fertig · Übung beenden<small>${nx ? `dann ${fmt(S.settings.restEx)} Pause bis ${esc(nx.name)}` : "letzte Übung des Tages"}</small></button>`;
}

/* ---------- Wochenübersicht ---------- */
function renderWeek(off){
  const t = today0(), mon = addDays(monday(t), 7*off), key = keyOf(mon), w = week(mon);
  const label = off === 0 ? "Diese Woche" : off === 1 ? "Nächste Woche" : off === -1 ? "Letzte Woche" : `Woche ab ${dm(mon)}`;
  const rows = WD.map((name, i) => {
    const d = addDays(mon, i), id = dayAt(w, i), past = d < t, isT = +d === +t;
    const done = id && doneInWeek(id, mon), missed = id && !done && past;
    const pills = [];
    if (done) pills.push(`<span class="pill ok">erledigt</span>`);
    else if (missed) pills.push(`<span class="pill miss">verpasst</span>`);
    else if (isT && id) pills.push(`<span class="pill now">heute</span>`);
    if (id && w.plan[id] !== DEFAULT_PLAN[id]) pills.push(`<span class="pill">verschoben von ${WDS[DEFAULT_PLAN[id]]}</span>`);
    const gym = id
      ? `<div class="l1"><span class="gym">${esc(dayOf(id).name)}</span>${pills.join("")}</div><div class="sub">${esc(dayOf(id).sub)}</div>`
      : `<div class="l1"><span class="rest">${BLOCKED[i] ? `Kein Gym: ${esc(BLOCKED[i])}` : "Ruhetag"}</span>${isT ? `<span class="pill now">heute</span>` : ""}</div>`;
    const ev = fbEvents(w, i).map(e => `<div class="ev">${I.ball}<span>${esc(e)}</span></div>`).join("");
    const warn = id === "legs" ? legsWarnings(i, w).map(x => `<div class="warn">${I.alert}<span>${esc(x)}</span></div>`).join("") : "";
    const btn = id && !done ? `<button class="sbtn" data-action="move" data-key="${key}" data-id="${id}">Verschieben</button>` : "";
    return `<li class="wday ${isT ? "is-today" : ""} ${past && !isT ? "past" : ""}">
      <div class="dl"><b>${WDS[i]}</b><small>${dm(d)}</small></div>
      <div>${gym}${ev}${warn}${btn}</div></li>`;
  }).join("");
  app.innerHTML = `
    <div class="top"><button class="back" data-action="home">${I.back}<span>Übersicht</span></button></div>
    <div class="wknav">
      <button class="iconbtn" data-action="weekNav" data-v="${off-1}" aria-label="Vorherige Woche"><span style="display:grid">${I.back}</span></button>
      <div style="text-align:center"><h1>${label}</h1><div class="k">${dm(mon)} – ${dm(addDays(mon,6))}</div></div>
      <button class="iconbtn" data-action="weekNav" data-v="${off+1}" aria-label="Nächste Woche">${I.next}</button>
    </div>
    <p class="seglbl">Spiel diese Woche</p>
    <div class="seg" role="group" aria-label="Spieltag">
      ${[[5,"Samstag"],[6,"Sonntag"],[null,"noch offen"]].map(([v,l]) =>
        `<button data-action="match" data-key="${key}" data-v="${v}" aria-pressed="${w.match === v}">${l}</button>`).join("")}
    </div>
    <ul class="days">${rows}</ul>`;
  setBar("");
}
function renderMove(key, id){
  const t = today0(), mon = fromKey(key), w = week(mon), cur = w.plan[id], off = Math.round((mon - monday(t)) / 864e5 / 7);
  const opts = WD.map((name, i) => {
    const d = addDays(mon, i), other = dayAt(w, i);
    let why = "", dis = false, cls = "";
    if (i === cur){ why = "aktuell geplant"; dis = true; cls = "cur"; }
    else if (BLOCKED[i]){ why = `kein Gym: ${BLOCKED[i]}`; dis = true; }
    else if (d < t){ why = "schon vorbei"; dis = true; }
    else if (other && addDays(mon, cur) < t){ why = `schon ${dayOf(other).name}`; dis = true; }
    else if (other) why = `tauschen mit ${dayOf(other).name}`;
    else why = fbEvents(w, i).join(" · ") || "frei";
    const legsAt = id === "legs" ? i : other === "legs" ? cur : null;
    const warns = !dis && legsAt != null ? legsWarnings(legsAt, w) : [];
    const warnTxt = warns.length && other === "legs" ? ["Beine landen dann am " + WD[cur] + ":", ...warns] : warns;
    return `<button class="opt ${cls}" ${dis ? "disabled" : ""} data-action="moveTo" data-key="${key}" data-id="${id}" data-i="${i}">
      <b>${name}</b> <span class="why">· ${dm(d)} · ${esc(why)}</span>
      ${warnTxt.map(x => `<div class="warn">${I.alert}<span>${esc(x)}</span></div>`).join("")}</button>`;
  }).join("");
  app.innerHTML = `
    <div class="top"><button class="back" data-action="weekNav" data-v="${off}">${I.back}<span>Woche</span></button></div>
    <div class="exhead"><h1>${esc(dayOf(id).name)} verschieben</h1>
      <p>Geplant: ${WD[cur]}, ${dm(addDays(mon, cur))}${cur !== DEFAULT_PLAN[id] ? ` · normal ${WD[DEFAULT_PLAN[id]]}` : ""}</p>
      ${id === "legs" ? `<div class="hint">Beine nicht direkt vor ein Spiel oder Fußballtraining legen. Vor solchen Tagen nur Oberkörper.</div>` : ""}
    </div>
    <div class="opts">${opts}</div>
    ${cur !== DEFAULT_PLAN[id] && !(dayAt(w, DEFAULT_PLAN[id])) && addDays(mon, DEFAULT_PLAN[id]) >= t
      ? `<div class="stack"><button class="btn" data-action="moveTo" data-key="${key}" data-id="${id}" data-i="${DEFAULT_PLAN[id]}">Zurück auf ${WD[DEFAULT_PLAN[id]]}</button></div>` : ""}`;
  setBar("");
}

  save(); unlockAudio(); wake(); tick();
}
function stopTimer(){ S.timer = null; save(); tick(); }
function tick(){
  const t = S.timer;
  tEl.hidden = !t; syncBars();
  document.body.style.paddingBottom = t ? "120px" : "";
  if (!t) return;
  const rem = (t.endAt - Date.now())/1000, fin = rem <= 0;
  tEl.classList.toggle("fin", fin);
  tTime.textContent = fmt(rem);
  tBar.style.transform = `scaleX(${Math.max(0, Math.min(1, rem / t.total))})`;
  const nx = t.nextId && EX[t.nextId];
  if (t.kind === "set"){
    tLabel.textContent = fin ? "Pause vorbei" : "Satzpause";
    tNext.textContent = `Gleich: Satz ${t.setNo}`;
    tEnd.textContent = fin ? `Los: Satz ${t.setNo}` : "Pause beenden";
  } else {
    tLabel.textContent = fin ? "Pause vorbei" : "Pause bis zur nächsten Übung";
    tNext.textContent = nx ? `Gleich: ${nx.name}` : "";
    tEnd.textContent = nx ? (fin ? "Los: nächste Übung" : "Nächste Übung öffnen") : "Fertig";
  }
  if (fin && !t.alerted){
    t.alerted = true; save();
    live.textContent = t.kind === "set" ? `Pause vorbei. Satz ${t.setNo}.` : `Pause vorbei. ${nx ? nx.name : ""}`;
    if (S.settings.sound) beep();
    if (S.settings.vibrate && navigator.vibrate) navigator.vibrate([300,150,300,150,600]);
  }
}
setInterval(tick, 250);

let actx;
function unlockAudio(){
  try{
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(); g.gain.value = 0; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .01);
  }catch(e){}
}
function beep(){
  try{
    if (!actx) return;
    if (actx.state === "suspended") actx.resume();
    [0, .35, .7].forEach((d,i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + d;
      o.frequency.value = i === 2 ? 1320 : 880; o.type = "sine";
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.6, t0+.02); g.gain.linearRampToValueAtTime(0, t0+.25);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+.3);
    });
  }catch(e){}
}
let lock = null;
async function wake(){
  if (!S.settings.wake || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try{ if (!lock || lock.released) lock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible"){ tick(); if (S.timer || S.active) wake(); } });

/* ---------- Aktionen ---------- */
function rerender(){ route(); }
function markStarted(id){ const s = session(EX[id].day); s.started ||= new Date().toISOString(); }

const actions = {
  settings: () => go("/settings"),
  home: () => go("/"),
  week: () => go("/week"),
  weekNav: b => go(b.dataset.v === "0" ? "/week" : "/week/" + b.dataset.v),
  match: b => { const w = week(fromKey(b.dataset.key)); w.match = b.dataset.v === "null" ? null : Number(b.dataset.v); save(); route(); },
  move: b => go(`/move/${b.dataset.key}/${b.dataset.id}`),
  moveTo: b => {
    const mon = fromKey(b.dataset.key), w = week(mon), id = b.dataset.id, i = Number(b.dataset.i), cur = w.plan[id];
    const other = dayAt(w, i), legsAt = id === "legs" ? i : other === "legs" ? cur : null;
    const warns = legsAt != null ? legsWarnings(legsAt, w) : [];
    if (warns.length && !confirm(`Achtung, Beintag am ${WD[legsAt]}:\n\n${warns.join("\n")}\n\nTrotzdem verschieben?`)) return;
    if (other) w.plan[other] = cur;
    w.plan[id] = i; save();
    toast(`${dayOf(id).name} jetzt am ${WD[i]}`);
    const off = Math.round((mon - monday(today0())) / 864e5 / 7);
    go(off === 0 ? "/week" : "/week/" + off);
  },
  startToday: b => {
    const d = dayOf(b.dataset.id); S.day = d.id; save();
    const first = d.ex.find(e => !isDone(item(e.id)) && !item(e.id).skipped) || d.ex[0];
    go("/ex/" + first.id);
  },
  day: b => { S.day = b.dataset.day; save(); renderHome(); },
  open: b => { if (S.timer && S.timer.kind === "ex" && S.timer.nextId === b.dataset.id && S.timer.alerted) stopTimer(); go("/ex/" + b.dataset.id); },
  quick: b => {
    const id = b.dataset.id, it = item(id), all = isDone(it);
    it.sets.forEach(s => s.done = !all); it.skipped = false; markStarted(id); save(); renderHome();
  },
  toggleSet: b => {
    const it = item(S.active), s = it.sets[+b.dataset.i];
    s.done = !s.done; if (s.done) it.skipped = false; markStarted(S.active); save(); rerender();
  },
  setDone: () => {
    const id = S.active, it = item(id), n = it.sets.findIndex(s => !s.done);
    if (n < 0) return;
    it.sets[n].done = true; it.skipped = false; markStarted(id); save();
    if (n < it.sets.length - 1) startTimer("set", id, null, n + 2);
    else { const nx = nextOpen(id); if (nx) startTimer("ex", id, nx.id); else { stopTimer(); toast("Alle Übungen erledigt – stark!"); } }
    rerender();
  },
  skip: () => { item(S.active).skipped = true; save(); const nx = nextOpen(S.active); nx ? go("/ex/" + nx.id) : go("/"); },
  unskip: () => { item(S.active).skipped = false; save(); rerender(); },
  resetEx: () => { const it = item(S.active); it.sets.forEach(s => { s.done = false; s.val = ""; }); save(); rerender(); },
  wStep: b => {
    const xd = exData(S.active), cur = num(xd.weight) ?? 0;
    xd.weight = fmtNum(Math.max(0, cur + Number(b.dataset.v) * S.settings.step)); save();
    document.getElementById("weight").value = xd.weight;
  },
  rest: b => {
    const k = b.dataset.k; S.settings[k] = Math.min(600, Math.max(15, S.settings[k] + Number(b.dataset.v))); save();
    document.getElementById("o-" + k).textContent = fmt(S.settings[k]);
    if (location.hash.startsWith("#/ex/")) setBar(primaryHTML(EX[S.active], item(S.active)));
  },
  stepW: b => { S.settings.step = Math.min(10, Math.max(0.5, S.settings.step + Number(b.dataset.v))); save(); document.getElementById("o-step").textContent = fmtNum(S.settings.step) + " kg"; },
  tAdd: b => {
    const t = S.timer; if (!t) return;
    t.endAt = Math.max(Date.now(), Math.max(Date.now(), t.endAt) + Number(b.dataset.v)*1000);
    t.total = Math.max(t.total, (t.endAt - Date.now())/1000);
    if (t.endAt > Date.now()) t.alerted = false;
    save(); tick();
  },
  tEnd: () => {
    const t = S.timer; if (!t) return;
    const nx = t.kind === "ex" && t.nextId;
    stopTimer();
    if (nx) go("/ex/" + nx);
  },
  finishDay: () => {
    const d = dayOf(S.day), s = session(d.id), items = {};
    d.ex.forEach(e => {
      const it = item(e.id);
      if (doneCount(it) || it.skipped || it.sets.some(x => x.val !== ""))
        items[e.id] = {done:isDone(it), skipped:it.skipped, weight:exData(e.id).weight, vals:it.sets.map(x => x.val)};
    });
    if (!Object.keys(items).length) return;
    const open = d.ex.filter(e => !isDone(item(e.id)) && !item(e.id).skipped).length;
    if (!confirm(open ? `${open} Übung(en) sind noch offen. Trotzdem abschließen und speichern?` : "Training abschließen und im Verlauf speichern?")) return;
    S.history.push({day:d.id, date:new Date().toISOString(), started:s.started, items});
    delete S.sessions[d.id];
    S.active = null; if (S.timer) S.timer = null;
    const nx = nextTraining(false); S.day = nx ? nx.id : d.id;
    save(); tick(); renderHome(); toast(nx ? `Gespeichert. Nächstes Training: ${whenTxt(nx)} · ${dayOf(nx.id).name}` : "Gespeichert.");
  },
  export: async () => {
    const name = `trainingsplan-${new Date().toISOString().slice(0,10)}.json`;
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
    try{
      const file = new File([blob], name, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Trainingsplan-Sicherung"}); return; }
    }catch(e){ if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  import: () => document.getElementById("importFile").click(),
  wipe: () => {
    if (!confirm("Wirklich alles löschen? Gewichte, Notizen und Verlauf sind dann weg.")) return;
    S = fresh(); save(); tick(); go("/"); toast("Alles gelöscht");
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if (!b) return;
  unlockAudio();
  const fn = actions[b.dataset.action]; if (fn) fn(b);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.setting) return;
  if (!S.active || !location.hash.startsWith("#/ex/")) return;
  const xd = exData(S.active);
  if (el.id === "weight") xd.weight = el.value.trim();
  else if (el.id === "setup") xd.setup = el.value;
  else if (el.id === "note") xd.note = el.value;
  else if (el.dataset.rep !== undefined){
    const it = item(S.active); it.sets[+el.dataset.rep].val = el.value.replace(/[^0-9]/g, "").slice(0,3);
    if (el.value !== it.sets[+el.dataset.rep].val) el.value = it.sets[+el.dataset.rep].val;
    const ex = EX[S.active], l = lastEntry(S.active);
    document.getElementById("dueBox").innerHTML = dueHTML(ex, it, l && reached(ex, l.vals));
  } else return;
  save();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.setting){ S.settings[el.dataset.setting] = el.checked; save(); if (el.dataset.setting === "wake" && el.checked) wake(); }
  if (el.id === "importFile" && el.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if (!d || d.v !== 1 || typeof d.ex !== "object" || !Array.isArray(d.history)) throw 0;
        if (!confirm("Sicherung laden? Die aktuellen Daten werden ersetzt.")) return;
        S = {...fresh(), ...d, settings:{...DEFAULTS, ...d.settings}, timer:null}; save(); tick(); go("/"); route(); toast("Sicherung geladen");
      }catch(err){ toast("Das ist keine gültige Sicherung"); }
      el.value = "";
    };
    r.readAsText(el.files[0]);
  }
});

window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });

/* App-Icon für den Home-Bildschirm (iPhone braucht PNG) */
(function icon(){
  try{
    const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d");
    x.fillStyle = "#0f1113"; x.fillRect(0,0,180,180);
    x.strokeStyle = "#7fd4a6"; x.lineWidth = 12; x.lineCap = "round";
    x.beginPath(); x.moveTo(50,90); x.lineTo(130,90); x.stroke();
    x.fillStyle = "#7fd4a6"; [[34,62,18,56],[128,62,18,56]].forEach(r => { x.beginPath(); x.roundRect ? x.roundRect(...r,6) : x.rect(...r); x.fill(); });
    const l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL("image/png"); document.head.appendChild(l);
    const f = document.createElement("link"); f.rel = "icon"; f.href = l.href; document.head.appendChild(f);
  }catch(e){}
})();

if (S.timer && S.timer.endAt < Date.now() - 30*60*1000) S.timer = null; // alter Timer nach Neustart
{ const nx = nextTraining(true); if (nx) S.day = nx.id; save(); } // Startbildschirm zeigt heutiges bzw. nächstes Training
route(); tick();
</script>
</body>
